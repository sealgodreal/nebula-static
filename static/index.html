<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, shrink-to-fit=no"
		/>
		<title>Home - Classroom</title>
		<link rel="icon" type="image/png" href="assets/gclassroom.png" />
		<link rel="stylesheet" href="index.css" />

    	<script src="/baremux/index.js" defer></script>
    	<script src="/wk/wk2.js" defer></script>
    	<script src="/wk/wk3.js" defer></script>
    	<script src="/assets/js/index.js" defer></script>
    	<script src="/assets/js/register.js" defer></script>

		<script>
  		if (window.location.pathname === "/index.html") {
    		window.location.pathname = "/";
  		}
		</script>

	</head>
	<body>
<div id="browser-toolbar">
<div class="nav-buttons">
	<button id="back-btn" type="button" title="Back" aria-label="Back">
		<svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
			<path
				d="M19 12H5"
				stroke="currentColor"
				stroke-width="2"
				stroke-linecap="round"
			/>
			<path
				d="M12 19L5 12L12 5"
				stroke="currentColor"
				stroke-width="2"
				stroke-linecap="round"
				stroke-linejoin="round"
			/>
		</svg>
	</button>

	<button id="forward-btn" type="button" title="Forward" aria-label="Forward">
		<svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
			<path
				d="M5 12H19"
				stroke="currentColor"
				stroke-width="2"
				stroke-linecap="round"
			/>
			<path
				d="M12 5L19 12L12 19"
				stroke="currentColor"
				stroke-width="2"
				stroke-linecap="round"
				stroke-linejoin="round"
			/>
		</svg>
	</button>

	<button id="reload-btn" type="button" title="Reload" aria-label="Reload">
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="rotate-cw" aria-hidden="true" class="lucide lucide-rotate-cw icon"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path></svg>
	</button>
</div>


	<div class="url-bar">
<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>

		<input
			id="browser-url"
			type="text"
			placeholder="Search or enter URL"
			autocomplete="off"
			spellcheck="false"
		/>
	</div>
</div>

<button
	id="toolbar-toggle"
	type="button"
	aria-label="Expand browser toolbar"
	aria-expanded="false"
>
<svg
	class="toolbar-toggle-icon"
	width="14"
	height="9"
	viewBox="0 0 14 9"
	fill="none"
	xmlns="http://www.w3.org/2000/svg"
	aria-hidden="true"
>
<path
	d="M3 1.5L7 5L11 1.5"
	stroke="currentColor"
	stroke-width="0.8"
	stroke-linecap="round"
	stroke-linejoin="round"
/>
</svg>
</button>

		<iframe id="background-frame" src="assets/bg.html" title="Background"></iframe>
		<div title="logo" class="flex-center logo-wrapper header-center">
			<img class="logo" src="nebula-logo.png" alt="neb" />
		</div>

		<div class="subtitle-wrapper"><p id="nebula-subtitle"></p></div>

		<form id="form" class="flex-center">
			<div class="search-box">
				<svg class="search-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
					<circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.4"/>
					<path d="M10.5 10.5L13.5 13.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
				</svg>

				<input
					id="address"
					type="text"
					placeholder="Search or enter URL"
					autocomplete="off"
					spellcheck="false"
				/>

				<button class="search-btn" type="submit" title="Search" aria-label="Search">
					<svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
						<path d="M2.5 7h9M8 3.5L11.5 7 8 10.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
					</svg>
				</button>
			</div>
		</form>

		<div class="desc left-margin">
			<p id="sj-error"></p>
			<pre id="sj-error-code"></pre>
		</div>

		<script src="assets/subtexts.js"></script>
		<script src="assets/bar.js"></script>
	</body>
</html>
